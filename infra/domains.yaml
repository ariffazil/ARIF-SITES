domains:
  # ─── TRINITY NETWORK — LIVE RUNTIME (Verified 2026-05-17) ─────────────────

  - host: arif-fazil.com
    type: static
    source: sites/arif-fazil.com
    build: npm run build
    output: dist/
    routes: ["/", "/000", "/999"]
    deploy: vps-caddy
    webroot: /var/www/html/arif
    role: SOUL
    status: flagship
    note: Live origin is VPS — Caddy serves from /var/www/html/arif. domains.yml previously claimed cloudflare-pages incorrectly.

  - host: arifos.arif-fazil.com
    type: static
    source: sites/arifos.arif-fazil.com
    routes: ["/"]
    deploy: vps-caddy
    webroot: /var/www/html/arifos
    role: MIND
    status: flagship
    note: Static docs + MCP proxy. /mcp* → arifosmcp:8080. Live origin is VPS.

  - host: aaa.arif-fazil.com
    type: static
    source: sites/aaa.arif-fazil.com
    build: npm run build
    output: dist/
    routes: ["/"]
    deploy: vps-caddy
    webroot: /var/www/html/aaa
    role: BODY
    status: flagship
    note: Static cockpit + A2A API. /a2a/* /api/* /health → 127.0.0.1:3001. Live origin is VPS.

  - host: mcp.arif-fazil.com
    type: dynamic
    source: services/arifosmcp
    routes: ["/mcp", "/health", "/tools", "/.well-known/agent.json"]
    deploy: vps-docker
    upstream: arifosmcp:8080
    role: MIND-MCP
    status: flagship

  # ─── FIELD / ORGAN SERVICES ────────────────────────────────────────────────

  - host: geox.arif-fazil.com
    type: organ
    source: sites/geox.arif-fazil.com
    routes: ["/", "/mcp*", "/health", "/status"]
    deploy: vps-caddy
    webroot: /var/www/html/geox
    upstream: geox_eic:8081
    role: FIELD
    status: active
    note: Static site + MCP proxy to geox_eic:8081.

  - host: wealth.arif-fazil.com
    type: organ
    source: services/wealth-organ
    routes: ["/", "/mcp*", "/health", "/sse*"]
    deploy: vps-caddy
    webroot: /var/www/html/wealth
    upstream: 127.0.0.1:8082
    role: CAPITAL
    status: active
    note: Static site + MCP proxy to 127.0.0.1:8082. Missing from prior domains.yml.

  - host: well.arif-fazil.com
    type: organ
    source: services/well
    routes: ["/mcp*", "/health", "/ready"]
    deploy: vps-caddy
    upstream: 127.0.0.1:8083
    role: VITALITY
    status: active
    note: MCP proxy only — no static site. Missing from prior domains.yml.

  # ─── INFRASTRUCTURE ────────────────────────────────────────────────────────

  - host: forge.arif-fazil.com
    type: gateway
    source: services/af-bridge-prod
    routes: ["/webhook/forge*", "/webhook/github*", "/health"]
    deploy: vps-docker
    upstream: 127.0.0.1:8443
    role: FORGE
    status: active
    note: A-FORGE webhook gateway. Previously misclassified as static site.

  - host: wiki.arif-fazil.com
    type: static
    source: sites/wiki.arif-fazil.com
    routes: ["/"]
    deploy: vps-caddy
    webroot: /var/www/html/wiki
    role: WIKI
    status: secondary
    note: Live origin is VPS. Previously claimed cloudflare-pages incorrectly.

  - host: ollama.arif-fazil.com
    type: infra
    source: services/ollama
    routes: ["/"]
    deploy: vps-docker
    upstream: 127.0.0.1:11434
    role: INFERENCE
    status: active
    note: Local LLM endpoint. Missing from prior domains.yml.

  # ─── REMOVED 2026-05-12 — Do not resurrect without sovereign approval ──────
  # arifosmcp.arif-fazil.com  → redirect to arifos.arif-fazil.com/mcp
  # waw.arif-fazil.com        → removed
  # wawa.arif-fazil.com       → removed
  # travel.arif-fazil.com     → removed
  # apex.arif-fazil.com       → removed
