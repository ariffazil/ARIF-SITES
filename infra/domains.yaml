domains:
  # ─── TRINITY NETWORK ───────────────────────────────────────────────────────

  - host: arif-fazil.com
    type: static
    source: sites/arif-fazil.com
    routes: ["/", "/000", "/999"]
    deploy: cloudflare-pages
    role: SOUL      # Human anchor, identity, portfolio, /000 genesis, /999 validation
    status: flagship

  - host: arifos.arif-fazil.com
    type: static
    source: sites/arifos.arif-fazil.com
    routes: ["/"]
    deploy: cloudflare-pages
    role: MIND      # arifOS docs, tool registry, observatory, /labs index
    status: flagship

  - host: mcp.arif-fazil.com
    type: dynamic
    source: services/arifosmcp
    routes: ["/mcp", "/health", "/tools", "/.well-known/agent.json"]
    deploy: vps-docker
    upstream: arifosmcp:8080
    role: MIND-MCP  # Canonical MCP API endpoint — /mcp, /health, /tools, /.well-known/agent.json
    status: flagship

  - host: aaa.arif-fazil.com
    type: static
    source: sites/aaa.arif-fazil.com
    routes: ["/"]
    deploy: cloudflare-pages
    role: BODY      # AAA + A-FORGE overview, operator cockpit entry, agent governance
    status: flagship

  # ─── REMOVED ────────────────────────────────────────────────────────────────
  # arifosmcp.arif-fazil.com  — removed 2026-05-12 (was redirect to mcp)

  # ─── SECONDARY / FIELD ──────────────────────────────────────────────────────

  - host: forge.arif-fazil.com
    type: static
    source: sites/forge.arif-fazil.com
    deploy: cloudflare-pages
    role: FORGE    # Agent deployment CI/CD surface
    status: active

  - host: wiki.arif-fazil.com
    type: static
    source: sites/wiki.arif-fazil.com
    deploy: cloudflare-pages
    role: WIKI     # Constitutional knowledge base
    status: secondary

  - host: geox.arif-fazil.com
    type: dynamic
    source: apps/geox
    deploy: vps-docker
    upstream: geox_gui:3000
    role: FIELD    # GEOX earth science UI — lab/field surface, not flagship
    status: active

  # ─── REMOVED ────────────────────────────────────────────────────────────────
  # waw.arif-fazil.com       — removed 2026-05-12
  # wawa.arif-fazil.com      — removed 2026-05-12
  # travel.arif-fazil.com    — removed 2026-05-12
  # apex.arif-fazil.com      — removed 2026-05-12
  # arifosmcp.arif-fazil.com — removed 2026-05-12
