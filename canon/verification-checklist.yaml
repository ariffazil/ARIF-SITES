# verification-checklist — 17 Deploy Gates
#
# Operator: scripts/canon-sync.sh (the build pipeline) reads this file.
# Every gate must pass before any deploy. Block on failure. No graceful degradation.
#
# Triple parity: every canon file must have md5 parity across:
#   /root/arif-fazil.com/canon/ (source)
#   /var/www/html/canon/ (live mirror)
#   /root/web-canon/canon/ (GitHub source)
#
# version: ATLAS-1.0
# epoch: SEAL-2026-08-01-f13-batch-ack
# actor: kimi-code/FI-008
# sovereign: ARIF (F13)
# doctrine: DITEMPA BUKAN DIBERI — Verify before SEAL. 17 gates. None optional.

g1_json_schema:
  description: >-
    Every canon JSON file must validate against public-state.schema.json.
    No exceptions. Schema is the contract.
  applies_to:
    - atlas.json
    - navigation.json
    - design-tokens.json
    - typography.json
    - geometry.json
    - components.json
    - templates.json
    - federation.json
    - tool-surfaces.json
    - releases.json
    - content-model.schema.json
  command: |
    for f in /root/arif-fazil.com/canon/*.json; do
      python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"
    done
  fail_action: block_build
  ratify_evidence: F2_TRUTH

g2_schema_parity:
  description: >-
    All 3 canon copies (source, live, web-canon) must have md5 parity.
    If any pair differs, drift exists. Repair before deploy.
  applies_to: all_canon_files
  command: |
    for f in /root/arif-fazil.com/canon/*.json /root/arif-fazil.com/canon/*.yaml; do
      base=$(basename "$f")
      m1=$(md5sum /root/arif-fazil.com/canon/"$base" | cut -d' ' -f1)
      m2=$(md5sum /var/www/html/canon/"$base" | cut -d' ' -f1)
      m3=$(md5sum /root/web-canon/canon/"$base" | cut -d' ' -f1)
      [ "$m1" = "$m2" ] && [ "$m2" = "$m3" ] || echo "DRIFT: $base"
    done
  fail_action: block_build
  ratify_evidence: F11_AUDITABILITY

g3_build:
  description: "npm run build exits 0 with no warnings."
  applies_to: build_pipeline
  command: npm run build
  fail_action: block_build
  ratify_evidence: F8_GENIUS

g4_caddy:
  description: >-
    caddy validate exits 0 against /etc/caddy/Caddyfile.
    Caddyfile must be in sync with redirects.yaml (D3 one-hop).
  applies_to: caddy_runtime
  command: caddy validate --config /etc/caddy/Caddyfile
  fail_action: block_build
  ratify_evidence: F12_RESILIENCE

g5_routes:
  description: >-
    Every canonical URL returns 200. Every retired URL 301s correctly.
    No chained redirects. No 404s on canonical paths.
  applies_to: all_canonical_routes
  command: |
    for path in / /human /institution /earth /laws /arif \
               /human/well /institution/aaa /institution/wealth \
               /institution/arifos /institution/aforge /earth/geox \
               /earth/mcp /earth/hermes; do
      code=$(curl -s -o /dev/null -w "%{http_code}" "https://arif-fazil.com$path")
      [ "$code" = "200" ] || echo "FAIL: $path -> $code"
    done
  fail_action: block_build
  ratify_evidence: F12_RESILIENCE

g6_links:
  description: >-
    No broken internal links. Every <a href> in the built site is
    reachable (200 or 301, not 404 or 5xx).
  applies_to: built_site
  command: |
    python3 scripts/check-internal-links.py dist/
  fail_action: block_build
  ratify_evidence: F12_RESILIENCE

g7_navigation:
  description: >-
    Universal frame appears on every page. sovereign_strip, breadcrumb,
    prev_next_nav, mission_footer all present.
  applies_to: built_site
  command: |
    for f in dist/**/*.html; do
      grep -q "sovereign_strip\|sovereign-strip" "$f" || echo "FAIL: $f missing strip"
      grep -q "breadcrumb" "$f" || echo "FAIL: $f missing breadcrumb"
      grep -q "mission_footer\|mission-footer" "$f" || echo "FAIL: $f missing footer"
    done
  fail_action: block_build
  ratify_evidence: F4_CLARITY

g8_tokens:
  description: >-
    Design tokens loaded. No hard-coded colors in compiled CSS.
    All color values must be var(--color-N) tokens.
  applies_to: built_css
  command: |
    grep -rE "#[0-9a-fA-F]{3,8}" dist/*.css 2>/dev/null | grep -v "^[[:space:]]*--" | head -20
  fail_action: block_build
  ratify_evidence: F9_ANTIHANTU

g9_layout:
  description: >-
    templates.json lint passes. Every page uses one of
    [trinity-tile-page, organ-page, surface-page, agent-surface].
  applies_to: all_pages
  command: |
    python3 scripts/lint-templates.py dist/
  fail_action: block_build
  ratify_evidence: F4_CLARITY

g10_geometry:
  description: >-
    ONE torus per page. Lint blocks any page with two or more
    toroidal anchors (trinity_ring, mission_wheel, or none).
  applies_to: all_pages
  command: |
    python3 scripts/lint-torus.py dist/
  fail_action: block_build
  ratify_evidence: F9_ANTIHANTU

g11_typography:
  description: >-
    IBM Plex only. No Google Fonts. No other font families.
  applies_to: built_css
  command: |
    grep -E "@import|fonts\.googleapis|fonts\.gstatic" dist/*.css 2>/dev/null
  fail_action: block_build
  ratify_evidence: F2_TRUTH

g12_components:
  description: >-
    Button grades honored. SEAL=solid, HOLD=dashed, VOID=red hold-to-confirm.
    Red rationed to 3 surfaces only.
  applies_to: built_site
  command: |
    python3 scripts/lint-buttons.py dist/
  fail_action: block_build
  ratify_evidence: F9_ANTIHANTU

g13_visual:
  description: >-
    Playwright screenshots match baseline (pixel-diff < 0.1%).
    Run on every canonical route.
  applies_to: built_site
  command: |
    for path in /human /institution /earth /arif /laws; do
      playwright screenshot --url="https://arif-fazil.com$path" \
        --output=snapshots/${path//\//_}.png
    done
    python3 scripts/visual-diff.py snapshots/ baselines/
  fail_action: block_build
  ratify_evidence: F3_TRI_WITNESS

g14_epistemic:
  description: >-
    Each claim on the page has an evidence label (OBS · DER · INT · SPEC).
    Markdown claims without labels fail.
  applies_to: all_content
  command: |
    python3 scripts/lint-epistemic.py dist/
  fail_action: block_build
  ratify_evidence: F2_TRUTH

g15_floor:
  description: >-
    F1-F13 floors held. No VIOIDs from the agent lane. Any agent
    proposal that violates a floor is rejected at submit time.
  applies_to: agent_lane
  command: |
    python3 scripts/floor-check.py . --strict
  fail_action: block_build
  ratify_evidence: F1_F13

g16_f6_dual_register:
  description: >-
    Human-side prose uses EMPATHY voice. Kernel/audit surfaces
    use MARUAH voice. Both are present where the page audiences both.
  applies_to: all_content
  command: |
    python3 scripts/lint-f6.py dist/
  fail_action: block_build
  ratify_evidence: F6_EMPATHY_MARUAH

g17_receipt:
  description: >-
    VAULT999 receipt sealed. Every deploy must produce a forge_vault
    receipt with the build hash, gate results, and ratification.
  applies_to: deploy_artifact
  command: |
    forge_vault mode=receipt \
      name="DEPLOY-$(date -u +%Y%m%dT%H%M%SZ)" \
      category="deploy.ledger" \
      content="$(cat build-manifest.json)" \
      reason="DEPLOY"
  fail_action: block_deploy
  ratify_evidence: F11_AUDITABILITY

verification_pipeline:
  description: "Operator order for running all gates."
  order:
    - stage: "canon-sync"
      gates: [g1, g2]
    - stage: "build"
      gates: [g3, g8, g11, g12, g14]
    - stage: "caddy"
      gates: [g4]
    - stage: "routing"
      gates: [g5, g6, g7]
    - stage: "layout"
      gates: [g9, g10]
    - stage: "visual"
      gates: [g13]
    - stage: "governance"
      gates: [g15, g16]
    - stage: "receipt"
      gates: [g17]

maintenance:
  - trigger: "New gate"
    action: "Add g_N block; specify command, fail_action, ratify_evidence"
  - trigger: "Gate removal"
    action: "Sovereign (F13) only — 999_SEAL"
  - trigger: "Gate threshold change"
    action: "Operator + sovereign"
