name: "🛡️ Sites Sentinel"

# PR gate for flagship surface only.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q1-mcp-isolation:
    name: "Q1 — MCP Isolation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No live MCP host embeds in SPA src
        run: |
          set -euo pipefail
          HITS=$(git diff origin/main...HEAD -- 'sites/arif-fazil.com/src/**' 2>/dev/null | grep '^+' | grep -E 'localhost:808[0-9]|localhost:1808[0-9]|localhost:707[0-9]' | grep -vE '^(\+\+\+|.*#|.*//)' || true)
          if [[ -n "$HITS" ]]; then
            echo "::error::Live MCP localhost refs in SPA src"
            echo "$HITS"
            exit 1
          fi
          echo "✅ Q1 PASS"

  q2-identity:
    name: "Q2 — Identity"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          set -euo pipefail
          test -f sites/arif-fazil.com/package.json
          test -f sites/arif-fazil.com/src/App.tsx
          test -f sites/arif-fazil.com/surfaces.json
          echo "✅ Q2 PASS"

  q3-build:
    name: "Q3 — Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sites/arif-fazil.com/package-lock.json
      - name: Install & Build
        working-directory: sites/arif-fazil.com
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          CI: "false"
      - name: Dist present
        run: test -f sites/arif-fazil.com/dist/index.html && echo "✅ Q3 PASS"

  sentinel-gate:
    name: "✅ Sentinel Gate"
    needs: [q1-mcp-isolation, q2-identity, q3-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate verdict
        run: |
          Q1="${{ needs.q1-mcp-isolation.result }}"
          Q2="${{ needs.q2-identity.result }}"
          Q3="${{ needs.q3-build.result }}"
          echo "Q1=$Q1 Q2=$Q2 Q3=$Q3"
          if [[ "$Q1" != "success" || "$Q2" != "success" || "$Q3" != "success" ]]; then
            echo "SENTINEL BLOCK"
            exit 1
          fi
          echo "SENTINEL PASS"
