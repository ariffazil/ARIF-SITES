name: auto-tag-date

# Creates vYYYY.MM.DD on main push if missing. Soft-fail if tag exists or push denied.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create date-stamped tag
        run: |
          set -euo pipefail
          git config user.email "forge@arif-fazil.com"
          git config user.name "arifOS Forge"
          TODAY="v$(date -u +'%Y.%m.%d')"
          if git rev-parse "$TODAY" >/dev/null 2>&1; then
            echo "✅ Tag $TODAY already exists. Skipping."
            exit 0
          fi
          # Prefer unsigned lightweight tag if signed tags blocked
          git tag "$TODAY" -m "$TODAY — auto-tagged forge date · DITEMPA BUKAN DIBERI" || true
          if git rev-parse "$TODAY" >/dev/null 2>&1; then
            git push origin "$TODAY" || echo "⚠️ tag push skipped (protection/signature)"
          fi
          echo "done"
