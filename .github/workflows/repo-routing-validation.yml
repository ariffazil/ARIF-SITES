name: Repo Routing Validation

# PR-only: commit trailers REPO=arif-fazil.com (optional hygiene).
# On push to main, skip (squash merges rarely carry trailers).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate REPO trailer (advisory soft-fail → hard on PR label)
        run: |
          set -euo pipefail
          TARGET_REPO="${{ github.event.repository.name }}"
          echo "Target repo: $TARGET_REPO"
          if ! git rev-parse origin/main >/dev/null 2>&1; then
            git fetch origin main:main 2>/dev/null || true
          fi
          RANGE="origin/main..HEAD"
          if ! git rev-list --count $RANGE >/dev/null 2>&1; then
            echo "No range vs origin/main — skip"
            exit 0
          fi
          FAIL=0
          while IFS= read -r line; do
            sha=$(echo "$line" | awk '{print $1}')
            body=$(git log -1 --format=%B "$sha")
            if ! echo "$body" | grep -qiE '^REPO='; then
              echo "⚠️ Commit $sha: missing REPO= trailer (advisory)"
              FAIL=1
              continue
            fi
            DECLARED=$(echo "$body" | grep -iE '^REPO=' | head -1 | sed 's/^REPO=//i' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$DECLARED" != "$(echo "$TARGET_REPO" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "❌ Commit $sha: REPO=$DECLARED expected $TARGET_REPO"
              exit 1
            fi
            echo "✅ $sha REPO=$DECLARED"
          done < <(git log --format='%H' $RANGE)
          if [ "$FAIL" -eq 1 ]; then
            echo "Advisory: prefer REPO=$TARGET_REPO on commit messages"
          fi
          echo "✅ routing validation complete"
