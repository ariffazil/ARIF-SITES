name: Build — Flagship Site

# Build validation only. Deploy path: VPS scripts/deploy-vps.sh → /var/www/html/arif

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arif:
    name: Build Ring 1 — ARIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/arif-fazil.com/package-lock.json
      - name: Install
        working-directory: sites/arif-fazil.com
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: sites/arif-fazil.com
        run: npm run build
        env:
          CI: "false"
      - name: Verify output
        run: |
          set -euo pipefail
          test -d sites/arif-fazil.com/dist
          test -f sites/arif-fazil.com/dist/index.html
          test -f sites/arif-fazil.com/public/llms.txt || test -f sites/arif-fazil.com/dist/llms.txt
          echo "✅ Ring 1 ARIF build OK"
