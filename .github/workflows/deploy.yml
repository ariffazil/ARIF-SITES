name: Build — Trinity Sites

# This workflow ONLY builds. It does NOT deploy.
# Actual deploy path: GitHub (arif-sites main) → scripts/deploy-vps.sh →
#   rsync to /var/www/html/ on VPS (72.62.71.199) → Caddy reverse proxy →
#   Cloudflare CDN (DNS only, NOT Pages).
# See ../CLOUDFLARE_DEPLOY.md for full truth. This workflow just validates the build works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:


permissions:
  contents: read

concurrency:
  group: sites-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ring 1 - ARIF
            directory: sites/arif-fazil.com
            build: true
          - name: Ring 3 - AAA
            directory: sites/aaa.arif-fazil.com
            build: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        if: ${{ matrix.build == true }}
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install
        if: ${{ matrix.build == true }}
        run: cd ${{ matrix.directory }} && npm ci --legacy-peer-deps

      - name: Build
        if: ${{ matrix.build == true }}
        run: cd ${{ matrix.directory }} && npm run build
        env:
          CI: false

      - name: Verify output
        run: |
          if [ "${{ matrix.build }}" = "true" ]; then
            test -d "${{ matrix.directory }}/dist" && echo "✅ dist/ exists" || (echo "❌ dist/ missing" && exit 1)
          else
            test -f "${{ matrix.directory }}/index.html" && echo "✅ static index.html exists" || (echo "❌ index.html missing" && exit 1)
          fi

      - name: Audit required files
        run: |
          DIR="${{ matrix.directory }}"
          if [ "${{ matrix.build }}" = "true" ]; then
            test -f "$DIR/public/llms.txt"  && echo "✅ llms.txt"  || echo "⚠️  llms.txt missing from public/"
            test -f "$DIR/public/robots.txt" && echo "✅ robots.txt" || echo "⚠️  robots.txt missing from public/"
          else
            test -f "$DIR/llms.txt"  && echo "✅ llms.txt"  || echo "⚠️  llms.txt missing"
            test -f "$DIR/index.html" && echo "✅ index.html" || echo "⚠️  index.html missing"
          fi
