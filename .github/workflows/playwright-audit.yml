name: Playwright Audit

# Optional UX audit — does not block main. Manual or nightly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/arif-fazil.com/package-lock.json
      - name: Install
        working-directory: sites/arif-fazil.com
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        working-directory: sites/arif-fazil.com
        run: npx playwright install --with-deps chromium || true
      - name: Run audit (best-effort)
        working-directory: sites/arif-fazil.com
        run: npx playwright test --reporter=list || echo "⚠️ playwright soft-fail"
        env:
          CI: "true"
