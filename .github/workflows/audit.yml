name: Floor Audit — Site Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: F4 Clarity — Required Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Flagship required files
        run: |
          set -euo pipefail
          test -f sites/arif-fazil.com/public/llms.txt
          test -f sites/arif-fazil.com/public/robots.txt
          test -f sites/arif-fazil.com/src/App.tsx
          test -f sites/arif-fazil.com/package.json
          test -f sites/arif-fazil.com/src/components/ArrowNavbar.tsx
          test -f sites/arif-fazil.com/src/data/navCanon.ts
          echo "✅ flagship integrity OK"
