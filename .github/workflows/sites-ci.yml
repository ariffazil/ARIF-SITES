name: "🌐 Sites CI — L4 PUBLIC"

# Canonical CI for arif-fazil.com (flagship SPA only).
# Deploy remains VPS: deploy-vps.sh → /var/www/html/arif (not Cloudflare Pages).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sites-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: 🗺️ Surface identity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate surface markers
        run: |
          set -euo pipefail
          test -f README.md
          test -f llms.txt || test -f sites/arif-fazil.com/llms.txt
          test -f sites/arif-fazil.com/package.json
          test -f sites/arif-fazil.com/surfaces.json
          # Federation pointer (symlink or file)
          if [ -f FEDERATION.md ] || [ -L FEDERATION.md ]; then
            echo "✅ FEDERATION.md present"
          else
            echo "⚠️ FEDERATION.md missing (non-blocking pointer)"
          fi
          echo "✅ identity OK — L4 public surface arif-fazil.com"

  build-flagship:
    name: 🏗️ Build flagship SPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/arif-fazil.com/package-lock.json
      - name: Install
        working-directory: sites/arif-fazil.com
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: sites/arif-fazil.com
        run: npm run build
        env:
          CI: "false"
      - name: Verify dist
        run: |
          set -euo pipefail
          test -d sites/arif-fazil.com/dist
          test -f sites/arif-fazil.com/dist/index.html
          test -f sites/arif-fazil.com/dist/llms.txt || test -f sites/arif-fazil.com/public/llms.txt
          echo "✅ dist + discovery present"

  verify:
    name: 🔍 Source surface verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [identity]
    steps:
      - uses: actions/checkout@v4
      - name: No hard-coded secret shapes in src
        run: |
          set -euo pipefail
          if grep -RInE 'sk-[a-zA-Z0-9]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
            sites/arif-fazil.com/src sites/arif-fazil.com/public \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' 2>/dev/null; then
            echo "❌ possible secret material in source"
            exit 1
          fi
          echo "✅ no secret shapes in source"
      - name: Nav canon contract present
        run: |
          test -f sites/arif-fazil.com/scripts/generate-nav-canon.cjs
          test -f sites/arif-fazil.com/src/data/navCanon.ts
          grep -q primaryNav sites/arif-fazil.com/src/components/ArrowNavbar.tsx
          echo "✅ nav driven by navCanon"
