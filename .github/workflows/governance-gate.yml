name: "🛡️ Federation Governance Gate"

# Lightweight: display-only surface must not embed organ secrets or claim JUDGE authority.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Surface authority ceiling
        run: |
          set -euo pipefail
          echo "=== arif-fazil.com RSI SCORECARD ==="
          echo "role: PUBLIC_SURFACE"
          echo "layer: L4"
          echo "authority_ceiling: DISPLAY_ONLY"
          # Fail if someone commits private key material
          if grep -RInE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist 2>/dev/null; then
            echo "❌ private key material in tree"
            exit 1
          fi
          echo "✅ governance gate soft-pass (DISPLAY_ONLY)"
