    <!-- arifOS WebMCP Surface — Tier 2 Agent Tool Registration -->
    <script src="/_shared/webmcp/arifos-webmcp-adapter.js"></script>
    <script>
      (function () {
        if (typeof window.arifosWebMCP === 'undefined') return;

        arifosWebMCP.registerReadonly(
          'get_federation_status',
          'Returns the arifOS federation manifest — live domain statuses, roles, and protocol declarations',
          {},
          async function () {
            const res = await fetch('/.well-known/arifos-federation.json');
            if (!res.ok) throw new Error('federation manifest unreachable');
            return await res.json();
          }
        );

        arifosWebMCP.registerReadonly(
          'get_wealth_briefing',
          'Returns the latest WEALTH daily briefing — Bursa, Ringgit, oil price, and macro signals (live or cached snapshot)',
          {},
          async function () {
            const res = await fetch('/data/wealth/latest.json');
            if (!res.ok) throw new Error('briefing snapshot unavailable');
            return await res.json();
          }
        );

        arifosWebMCP.registerReadonly(
          'verify_did',
          'Returns the W3C DID document for did:web:arif-fazil.com — cryptographic sovereign identity chain',
          {},
          async function () {
            const res = await fetch('/.well-known/did.json');
            if (!res.ok) throw new Error('DID document unreachable');
            return await res.json();
          }
        );

        arifosWebMCP.registerReadonly(
          'get_constitution',
          'Returns the arifOS constitutional floor definitions (F1–F13) — the governing law of the federation',
          {},
          async function () {
            const res = await fetch('https://arifos.arif-fazil.com/constitution.json');
            if (!res.ok) throw new Error('constitution unreachable');
            return await res.json();
          }
        );
      })();
    </script>
