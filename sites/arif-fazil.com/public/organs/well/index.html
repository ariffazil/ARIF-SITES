<script>
fetch('https://arifos.arif-fazil.com/api/public-state',{cache:'no-store'}).then(r=>r.json()).then(ps=>{
  var o=(ps.organs&&ps.organs['well'])||{};
  document.getElementById('live').textContent =
    'Observed by arifOS Observatory\n' +
    (o.public_tools!=null?o.public_tools+' public tools':'tools ?') +
    ' · transport ' + (o.transport||'?') + '\n' +
    'Release ' + (o.release||(ps.release&&ps.release.release_id)||'?') + '\n' +
    'Last observed ' + (o.last_observed||ps.generated_at||'?');
}).catch(()=>{document.getElementById('live').textContent='public-state unavailable';});
