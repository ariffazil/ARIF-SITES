<!DOCTYPE html>
<html lang="en" data-ring="SOUL" data-plane="narrative">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federation Pulse — arifOS</title>
<meta name="description" content="Live federation health — organ status, FQ, receipts, tools. One pulse for the entire arifOS federation.">
<link rel="canonical" href="https://arif-fazil.com/pulse/">
<link rel="stylesheet" href="/_shared/design-system/tokens.css">
<style>
  body { background: var(--bg-narrative, #0B0B0F); color: var(--text-primary, #F5F5F7); font-family: var(--font-sans, Inter, sans-serif); margin: 0; padding: 2rem; max-width: 960px; margin: 0 auto; }
  h1 { color: var(--gold-sovereign, #E8B84B); font-family: var(--font-display, Fraunces, serif); border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
  h2 { color: var(--gold-dim, #D4A24C); font-size: 1.1rem; margin-top: 2rem; }
  .pulse-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1rem 0; }
  .pulse-dot { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; border: 1px solid; }
  .pulse-dot .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .pulse-dot.healthy { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #22C55E; }
  .pulse-dot.degraded { background: rgba(234,179,8,0.1); border-color: rgba(234,179,8,0.3); color: #EAB308; }
  .pulse-dot.down { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #EF4444; }
  .pulse-dot .dot.healthy { background: #22C55E; }
  .pulse-dot .dot.degraded { background: #EAB308; }
  .pulse-dot .dot.down { background: #EF4444; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; margin: 1rem 0; }
  .metric-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 1.25rem; }
  .metric-card .value { font-size: 2rem; font-weight: 800; font-family: var(--font-mono, JetBrains Mono, monospace); }
  .metric-card .label { color: var(--text-secondary, #A8A9B4); font-size: 0.75rem; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .pulse-verdict { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; vertical-align: middle; }
  .pulse-verdict.optimal { background: rgba(34,197,94,0.2); color: #22C55E; }
  .pulse-verdict.balanced { background: rgba(234,179,8,0.2); color: #EAB308; }
  .pulse-verdict.watching { background: rgba(255,165,0,0.2); color: #FF8C00; }
  .pulse-verdict.stuck { background: rgba(239,68,68,0.2); color: #EF4444; }
  .organ-entry { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; padding: 1rem; margin-bottom: 0.5rem; }
  .organ-entry .name { font-weight: 700; font-size: 1rem; }
  .organ-entry .detail { font-size: 0.8rem; color: var(--text-secondary, #A8A9B4); }
  footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid #21262d; color: var(--text-muted); font-size: 0.8rem; text-align: center; }
  .stale { opacity: 0.5; }
  .timestamp { font-family: var(--font-mono, JetBrains Mono, monospace); font-size: 0.8rem; color: var(--text-muted, #6B6C78); }
</style>
</head>
<body>
<h1>⚡ Federation Pulse</h1>
<p id="subtitle" class="stale">Loading...</p>

<!-- Main metrics -->
<div id="metrics" class="metric-grid stale">
  <div class="metric-card"><div class="value" id="m-fq">—</div><div class="label">Flow Quotient</div></div>
  <div class="metric-card"><div class="value" id="m-organs">—</div><div class="label">Organs Healthy</div></div>
  <div class="metric-card"><div class="value" id="m-tools">—</div><div class="label">MCP Tools</div></div>
  <div class="metric-card"><div class="value" id="m-receipts">—</div><div class="label">Receipts Verified</div></div>
</div>

<h2>🟢 Organ Health</h2>
<div id="organ-pulse" class="pulse-row"></div>

<div id="organ-detail"></div>

<footer>
  <p>DITEMPA BUKAN DIBERI — Forged, Not Given — 999 SEAL ALIVE</p>
  <p><a href="/">arif-fazil.com</a> · <a href="/doctrine/">Doctrine (ABCD)</a> · <a href="https://arifos.arif-fazil.com">Observatory</a> · <a href="https://arif-fazil.com/missions">Six Missions</a> · <a href="https://mcp.arif-fazil.com/explorer.html">Tool Explorer (engine room)</a></p>
</footer>

<script>
async function loadPulse() {
  try {
    // Fetch pulse data (generated by fq-probe.sh cron)
    const pulseResp = await fetch('/pulse/data.json');
    let pulse = null;
    if (pulseResp.ok) pulse = await pulseResp.json();

    // Fetch full registry via Caddy proxy to arifOS MCP
    const regResp = await fetch('/mcp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0', id: 1,
        method: 'resources/read',
        params: { uri: 'arifos://tools/registry' }
      })
    });
    let registry = null;
    if (regResp.ok) {
      const regData = await regResp.json();
      const text = regData?.result?.contents?.[0]?.text;
      if (text) registry = JSON.parse(text);
    }

    const organs = registry?.organs || [];
    const summary = registry?.summary || {};

    // Update metrics
    if (pulse) {
      document.getElementById('m-fq').innerHTML = pulse.fq.toFixed(1) +
        ` <span class="pulse-verdict ${pulse.status.toLowerCase()}">${pulse.status}</span>`;
      document.getElementById('m-receipts').textContent = pulse.receipt_count.toLocaleString();
    }
    document.getElementById('m-organs').textContent = `${summary.organs_healthy}/${summary.organs_total}`;
    document.getElementById('m-tools').textContent = summary.tools_total_mcp || '—';
    document.getElementById('metrics').className = 'metric-grid';

    // Timestamp
    const ts = pulse?.timestamp || registry?.fetched_at;
    document.getElementById('subtitle').textContent =
      `Updated ${ts ? new Date(ts).toLocaleTimeString('en-MY', {timeZone:'Asia/Kuala_Lumpur'}) : '—'} MYT` +
      ` · ${summary.organs_healthy}/${summary.organs_total} organs · ${summary.tools_total_mcp || '?'} tools` +
      (pulse ? ` · FQ ${pulse.fq.toFixed(1)}` : '');
    document.getElementById('subtitle').className = '';

    // Organ dots
    const pulseRow = document.getElementById('organ-pulse');
    pulseRow.innerHTML = organs.map(o => {
      const cls = o.healthy ? 'healthy' : 'down';
      return `<span class="pulse-dot ${cls}" title="${o.organ} :${o.port} — ${o.healthy ? 'Healthy' : 'Unreachable'}"><span class="dot ${cls}"></span> ${o.organ}</span>`;
    }).join('');

    // Organ cards
    const detailEl = document.getElementById('organ-detail');
    detailEl.innerHTML = organs.map(o => {
      const tools = o.tool_count_mcp > 0
        ? `${o.tool_count_mcp} MCP tools`
        : o.tool_count_health ? `${o.tool_count_health} tools (health)` : '—';
      const note = o._note ? `<div class="detail">${o._note}</div>` : '';
      return `<div class="organ-entry">
        <div class="name" style="color:${o.healthy ? '#22C55E' : '#EF4444'}">${o.healthy ? '🟢' : '🔴'} ${o.organ}</div>
        <div class="detail">${o.role}</div>
        <div class="detail">:${o.port} · ${tools} · ${o.authority}</div>
        ${note}
      </div>`;
    }).join('');

  } catch (err) {
    document.getElementById('subtitle').textContent = '⚠ Error: ' + err.message;
    document.getElementById('subtitle').className = '';
  }
}

loadPulse();
setInterval(loadPulse, 30000);
</script>
</body>
</html>
