# Snippet for /klci/api/* and /usdmyr/api/* — added 2026-08-03
# Insert after the gas block in /etc/caddy/Caddyfile
redir /klci /klci/ 308
@klci_api path /klci/api/*
handle @klci_api {
  uri strip_prefix /klci
  reverse_proxy localhost:3459
}
handle /klci/* {
  root * /var/www/html/arif/klci
  try_files {path} /index.html
  file_server
}
redir /usdmyr /usdmyr/ 308
@usdmyr_api path /usdmyr/api/*
handle @usdmyr_api {
  uri strip_prefix /usdmyr
  reverse_proxy localhost:3460
}
handle /usdmyr/* {
  root * /var/www/html/arif/usdmyr
  try_files {path} /index.html
  file_server
}
